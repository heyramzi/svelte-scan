name: Release

# Only a changeset or a version bump can release anything.
on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "package.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# WHY: changesets/action pushes the changeset-release/main branch and opens the
# version PR, and publishes to the GitHub registry. The default token is
# read-only, which 403s on that push.
permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # WHY: a green release run takes under a minute. Ten minutes is the floor and
    # still stops a hung publish from holding the release concurrency group.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # WHY: this repo is pnpm ("packageManager" in package.json), and changeset
      # publish shells out to `pnpm publish`. Installing with npm left pnpm off
      # PATH, so publish died with `spawn pnpm ENOENT`. No `version:` input: the
      # action reads packageManager, so CI and local pnpm can't drift apart.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # WHY: pnpm needs Node 22 or newer. Node 20 dies with
          # ERR_UNKNOWN_BUILTIN_MODULE.
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@heyramzi"

      # WHY: the lockfile pins @heyramzi/lint, which lives on GitHub Packages.
      # setup-node writes an .npmrc that reads NODE_AUTH_TOKEN, so the token has
      # to be set on the install step itself. Run 34543948537 died here with a
      # 403 and "No authorization header was set".
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # WHY: pnpm leaves setup-node's `${NODE_AUTH_TOKEN}` placeholder
      # unexpanded and falls through to a 401 (it tries OIDC first, then gives
      # up without reading the env token). Writing the resolved token into
      # ~/.npmrc explicitly is what actually authenticates the publish. Same
      # workaround as vibe-kit's release-please workflow.
      - name: Configure npm auth
        run: |
          echo "@heyramzi:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
