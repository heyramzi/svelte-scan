name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# WHY: changesets/action pushes the changeset-release/main branch and opens the
# version PR, and publishes to the GitHub registry. The default token is
# read-only, which 403s on that push.
permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # WHY: this repo is pnpm ("packageManager": "pnpm@11"), and changeset
      # publish shells out to `pnpm publish`. Installing with npm left pnpm off
      # PATH, so publish died with `spawn pnpm ENOENT`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # WHY: pnpm 11 (packageManager) needs Node 22+; Node 20 dies with
          # ERR_UNKNOWN_BUILTIN_MODULE.
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@heyramzi"

      - run: pnpm install --frozen-lockfile

      # WHY: pnpm leaves setup-node's `${NODE_AUTH_TOKEN}` placeholder
      # unexpanded and falls through to a 401 (it tries OIDC first, then gives
      # up without reading the env token). Writing the resolved token into
      # ~/.npmrc explicitly is what actually authenticates the publish. Same
      # workaround as vibe-kit's release-please workflow.
      - name: Configure npm auth
        run: |
          echo "@heyramzi:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
