name: CI

# Manual only: the pre-push hook runs these checks on the Mac for free.
# vibe-kit ai-doc/references/github-actions-cost.md
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm test
